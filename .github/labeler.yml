feature:
- head-branch: '^feat/'
fix:
- head-branch: '^fix/'
refactor:
- head-branch: '^refactor/'
chore:
- head-branch: '^chore/'
library:
- changed-files:
  - all-globs-to-any-file: ['packages/minerender/**', '!packages/minerender/reference/**']
docs:
- changed-files:
  - any-glob-to-any-file: ['packages/minerender/reference/**', 'packages/minerender/README.md', 'README.md']
- head-branch: '^docs/'
api:
- changed-files:
  - any-glob-to-any-file: 'apps/api/**'
embed:
- changed-files:
  - any-glob-to-any-file: 'apps/embed/**'
site:
- changed-files:
  - any-glob-to-any-file: 'apps/site/**'
web:
- changed-files:
  - any-glob-to-any-file: 'apps/web/**'
apps:
- changed-files:
  - any-glob-to-any-file: 'apps/**'
examples:
- changed-files:
  - any-glob-to-any-file: 'examples/**'
ci:
- changed-files:
  - any-glob-to-any-file: '.github/**'
