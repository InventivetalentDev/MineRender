name: Node CI

on:
  push:
    branches: [master, main, typescript, 'refactor/**', 'fix/**']
  pull_request:
    branches: [master, main, typescript, 'refactor/**', 'fix/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build the library
        run: yarn build
      - name: Check types and run existing tests
        run: |
          yarn typecheck
          yarn test
      - name: Pack the public library
        run: yarn pack --out /tmp/minerender.tgz
