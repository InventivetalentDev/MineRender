name: Node CI

on:
  pull_request:
    branches: [master, main, typescript, 'refactor/**', 'fix/**', 'feat/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12.0', 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Enable Yarn
        run: corepack enable
      - name: Install native rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libwayland-client0 libxi-dev libglu1-mesa-dev libglew-dev libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Build the library and consumers
        run: yarn build
      - name: Check types and run tests
        run: |
          yarn typecheck
          yarn test
          yarn test:package
          yarn test:api
      - name: Test native rendering
        run: |
          xvfb-run -a yarn test:node
          xvfb-run -a yarn test:api:native
      - name: Pack the public library
        run: yarn workspace minerender pack --out /tmp/minerender.tgz
